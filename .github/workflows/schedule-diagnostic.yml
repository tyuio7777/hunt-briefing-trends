name: Temporary schedule diagnostic
on:
  schedule:
    - cron: '*/10 * * * *'
permissions: {}
jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print UTC time and event
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          printf '%s\n' "$GITHUB_EVENT_NAME"
